<!DOCTYPE html>
<html lang="en">

<link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator_simple.min.css" rel="stylesheet">
<script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>

<head>
    <meta charset="UTF-8">
    <title>Draft History</title>
</head>
<body>
<div id="history-table"></div>
<script>

    fetch("/draft-history-settings", { method: "GET", }).then((response) => response.json()).then((json) => {
        var table = new Tabulator("#history-table", json);
    });

</script>

</body>
</html>
